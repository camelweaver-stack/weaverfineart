# Weaver Fine Art — static Astro build. Publish the dist folder.
# Form detection reads the pre-rendered HTML. Notification email is set in the
# Netlify UI (Forms → form notifications), not in this file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#auto"

# Apex host. www follows the canonical domain.
[[redirects]]
  from = "https://www.weaverfineart.com/*"
  to = "https://weaverfineart.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
